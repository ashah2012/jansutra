[project]
name = "jansutra"
version = "0.1.0"
description = "Federated socioeconomic ontology for India's citizen welfare data"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "rich>=13",
]

[project.scripts]
jansutra-validate = "tools.validate:main"
jansutra-query = "tools.query:main"
jansutra-convert = "tools.convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
